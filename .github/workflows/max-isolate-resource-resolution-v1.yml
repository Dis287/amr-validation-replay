name: MAX_ISOLATE_RESOURCE_RESOLUTION_V1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: max-isolate-resource-resolution-v1-single-attempt
  cancel-in-progress: false

jobs:
  max-isolate-resource-resolution-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Initialize mandatory provisional outcome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/max-isolate-resource-resolution-v1/evidence" "${RUNNER_TEMP}/max-isolate-resource-resolution-v1/bundle"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "max-isolate-resource-resolution-v1" / "evidence"
          value = {
              "schema": "amr-max-isolate-resource-resolution-outcome-v1",
              "experiment_id": "MAX_ISOLATE_RESOURCE_RESOLUTION_V1",
              "target_isolate": "ERR223688",
              "status": "INCOMPLETE",
              "classification": "INFRASTRUCTURE_PREFLIGHT_FAILURE",
              "candidate_pass": False,
              "independent_audit_required": True,
              "first_failing_stage": "workflow_initialization",
              "no_retry_occurred": True,
              "original_n8_gate_remains_failed": True,
              "corrected_seer_n8_authorized": False,
              "full_1102_reconstruction_authorized": False,
              "model_training_authorized": False,
              "notes": ["Provisional record; replaced by the dedicated harness after checkout."],
              "missing_evidence": [],
          }
          (root / "outcome.json").write_text(json.dumps(value, indent=2, sort_keys=True) + "\n")
          PY

      - name: Check out frozen harness commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Execute single bounded scientific attempt
        id: scientific_run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 experiments/001_gonococcus_eucast_vs_clsi/run_max_isolate_resource_resolution_v1.py run \
            --root "${RUNNER_TEMP}/max-isolate-resource-resolution-v1"

      - name: Package all surviving evidence
        if: always()
        id: package
        run: |
          python3 experiments/001_gonococcus_eucast_vs_clsi/run_max_isolate_resource_resolution_v1.py package \
            --root "${RUNNER_TEMP}/max-isolate-resource-resolution-v1"

      - name: Upload complete evidence bundle
        if: always()
        id: full_upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: max-isolate-resource-resolution-v1-evidence
          path: |
            ${{ runner.temp }}/max-isolate-resource-resolution-v1/bundle/max-isolate-resource-resolution-v1-evidence.tar.gz
            ${{ runner.temp }}/max-isolate-resource-resolution-v1/bundle/artifact_ledger.json
            ${{ runner.temp }}/max-isolate-resource-resolution-v1/evidence/outcome.json
          if-no-files-found: error
          retention-days: 30

      - name: Finalize durable-retention outcome
        if: always()
        run: |
          python3 experiments/001_gonococcus_eucast_vs_clsi/run_max_isolate_resource_resolution_v1.py finalize-retention \
            --root "${RUNNER_TEMP}/max-isolate-resource-resolution-v1" \
            --full-upload "${{ steps.full_upload.outcome }}"

      - name: Upload final outcome record
        if: always()
        id: final_upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: max-isolate-resource-resolution-v1-final-outcome
          path: ${{ runner.temp }}/max-isolate-resource-resolution-v1/bundle/final_outcome.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce scientific and retention result
        if: always()
        env:
          SCIENTIFIC_OUTCOME: ${{ steps.scientific_run.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          FULL_UPLOAD_OUTCOME: ${{ steps.full_upload.outcome }}
          FINAL_UPLOAD_OUTCOME: ${{ steps.final_upload.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "max-isolate-resource-resolution-v1" / "evidence" / "outcome.json"
          outcome = json.loads(path.read_text())
          checks = {
              "scientific_step": os.environ["SCIENTIFIC_OUTCOME"],
              "package_step": os.environ["PACKAGE_OUTCOME"],
              "full_upload": os.environ["FULL_UPLOAD_OUTCOME"],
              "final_upload": os.environ["FINAL_UPLOAD_OUTCOME"],
          }
          print(json.dumps({"outcome": outcome, "workflow_checks": checks}, indent=2, sort_keys=True))
          accepted = outcome.get("candidate_pass") is True and all(value == "success" for value in checks.values())
          raise SystemExit(0 if accepted else 1)
          PY
